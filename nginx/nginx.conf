# Nginx sebagai load balancer round-robin ke dua replika aplikasi.
# max_fails + fail_timeout = health check pasif: instance yang gagal
# dikeluarkan sementara dari rotasi, trafik dialihkan ke instance lain.

upstream katalog_backend {
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://katalog_backend;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
